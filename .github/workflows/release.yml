name: Libryno Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.1.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as prerelease'
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  APP_NAME: Libryno

jobs:
  # =============================================================================
  # TESTES E LINT
  # =============================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linter (ruff)
        run: |
          ruff check src/
          ruff format --check src/

      - name: Run tests with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-fail-under=50

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  # =============================================================================
  # BUILD WINDOWS
  # =============================================================================
  build-windows:
    name: Build Windows Installer
    needs: test
    runs-on: windows-latest
    env:
      PYTHON_VERSION: '3.11'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec --clean --noconfirm

      - name: Verify PyInstaller binary
        run: |
          if (-not (Test-Path "dist\libryno.exe")) { Write-Error "dist\libryno.exe not found"; exit 1 }

      - name: Build NSIS installer (Libryno-Setup.exe)
        shell: pwsh
        run: |
          makensis packaging\windows\libryno.nsi

      - name: Verify installer
        run: |
          if (-not (Test-Path "dist\Libryno-Setup.exe")) { Write-Error "Libryno-Setup.exe not found"; exit 1 }
          ls -la dist\

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/Libryno-Setup.exe
          retention-days: 30

  # =============================================================================
  # BUILD LINUX
  # =============================================================================
  build-linux:
    name: Build Linux Packages
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller build.spec --clean --noconfirm

      - name: Identify binary name
        id: binary
        run: |
          ls -la dist/
          if [ -f dist/libryno ]; then
            echo "BIN=libryno" >> $GITHUB_OUTPUT
          elif [ -f dist/LIBRYNO ]; then
            echo "BIN=LIBRYNO" >> $GITHUB_OUTPUT
          else
            echo "BIN=" >> $GITHUB_OUTPUT
          fi

      - name: Build AppImage
        run: |
          # Instala appimagetool
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # Cria estrutura AppDir
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
          # Copia binário
          cp "dist/${{ steps.binary.outputs.BIN }}" AppDir/usr/bin/libryno
          # Cria .desktop
          cat > AppDir/usr/share/applications/libryno.desktop << 'EOF'
          [Desktop Entry]
          Name=Libryno
          Comment=Sistema de Gestão de Bibliotecas
          Exec=libryno
          Icon=libryno
          Terminal=false
          Type=Application
          Categories=Office;Education;
          EOF
          # Copia ícone
          cp img/logoicone.png AppDir/usr/share/icons/hicolor/256x256/apps/libryno.png
          # Cria AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage AppDir libryno-linux-x64.AppImage

      - name: Build .deb package
        run: |
          # Cria estrutura deb
          mkdir -p deb-package/DEBIAN
          mkdir -p deb-package/usr/bin
          mkdir -p deb-package/usr/share/applications
          mkdir -p deb-package/usr/share/icons/hicolor/256x256/apps
          mkdir -p deb-package/usr/share/doc/libryno
          # Copia binário
          cp "dist/${{ steps.binary.outputs.BIN }}" deb-package/usr/bin/libryno
          cp img/logoicone.png deb-package/usr/share/icons/hicolor/256x256/apps/libryno.png
          # .desktop
          cat > deb-package/usr/share/applications/libryno.desktop << 'EOF'
          [Desktop Entry]
          Name=Libryno
          Comment=Sistema de Gestão de Bibliotecas
          Exec=libryno
          Icon=libryno
          Terminal=false
          Type=Application
          Categories=Office;Education;
          EOF
          # Control file
          cat > deb-package/DEBIAN/control << EOF
          Package: libryno
          Version: 2.0.0
          Section: office
          Priority: optional
          Architecture: amd64
          Depends: libc6 (>= 2.31), libglib2.0-0 (>= 2.64), libqt6core6, libqt6gui6, libqt6widgets6, libqt6sql6, libqt6network6
          Maintainer: OrdoB <contato@ordob.com>
          Description: Sistema de Gestão de Bibliotecas Públicas
           O Libryno é um sistema completo de gestão de bibliotecas
           públicas integrado ao ecossistema OrdoB.
          EOF
          # Build .deb
          dpkg-deb --build deb-package libryno-linux-x64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            libryno-linux-x64.AppImage
            libryno-linux-x64.deb
          retention-days: 30

  # =============================================================================
  # CREATE GITHUB RELEASE
  # =============================================================================
  release:
    name: Create GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-files/windows

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: ./release-files/linux

      - name: Resolve tag and version
        id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${{ github.event.inputs.version }}"
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Generate release notes
        id: release_notes
        run: |
          version="${{ steps.resolve.outputs.VERSION }}"
          cat > release_notes.md << EOF
          # Libryno v${version}

          ## 📦 Downloads
          ### Windows
          - [Libryno-Setup.exe](https://github.com/${{ github.repository }}/releases/latest/download/Libryno-Setup.exe) - Aplicativo Windows

          ### Linux
          - [libryno-linux-x64.AppImage](https://github.com/${{ github.repository }}/releases/latest/download/libryno-linux-x64.AppImage) - AppImage portátil
          - [libryno-linux-x64.deb](https://github.com/${{ github.repository }}/releases/latest/download/libryno-linux-x64.deb) - Debian/Ubuntu

          ## ⚠️ Importante
          - Linux .deb: `sudo dpkg -i libryno-linux-x64.deb && sudo apt install -f`
          - AppImage: `chmod +x libryno-linux-x64.AppImage && ./libryno-linux-x64.AppImage`

          ---
          **Checksums SHA256:**
          $(sha256sum release-files/windows/* release-files/linux/* 2>/dev/null || echo "Calculando...")
          EOF
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve.outputs.TAG }}
          name: Libryno ${{ steps.resolve.outputs.TAG }}
          body: ${{ steps.release_notes.outputs.notes }}
          draft: false
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          files: |
            release-files/windows/Libryno-Setup.exe
            release-files/linux/libryno-linux-x64.AppImage
            release-files/linux/libryno-linux-x64.deb
          generate_release_notes: false

  # =============================================================================
  # NOTIFICATIONS
  # =============================================================================
  notify:
    name: Notify Team
    needs: release
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#releases'
          text: 'Libryno ${{ github.ref_name }} ${{ job.status == "success" && "released" || "failed" }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}

      - name: Send Discord notification
        if: env.DISCORD_WEBHOOK != ''
        run: |
          curl -X POST "${{ secrets.DISCORD_WEBHOOK }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"Libryno ${{ github.ref_name }} ${{ job.status == 'success' && 'released 🚀' || 'failed ❌' }}\"}"
